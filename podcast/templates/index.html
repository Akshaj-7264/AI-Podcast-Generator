<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🎙️ AI Podcast Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg rounded-4 border-0">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4">🎧 AI Podcast Generator</h2>
                    <p class="text-muted text-center mb-4">Enter a topic and let AI craft your podcast script and voice it out!</p>

                    <form method="post" class="mb-4">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form.topic.label_tag }}
                            {{ form.topic }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Generate Podcast</button>
                    </form>

                    {% if error_message %}
                        <div class="alert alert-danger">
                            <strong>Gemini Error:</strong> {{ error_message }}
                        </div>
                    {% endif %}

                    {% if script %}
                        <div class="mt-5">
                            <h4 class="text-success">📜 Generated Script</h4>
                            <div class="border rounded p-3 bg-white" style="white-space: pre-wrap;">{{ script }}</div>

                            <h4 class="mt-4">🔊 Listen</h4>
                            <audio controls class="w-100 mt-2">
                                <source src="{{ audio_url }}" type="audio/mpeg">
                                Your browser does not support the audio element.
                            </audio>
                        </div>
                    {% endif %}

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
